<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="hero-t hero-d">
  <title id="hero-t">A Quip site, packed for the move</title>
  <desc id="hero-d">Left: an open removal carton holding a dark folder and two documents with red comment notes, tied together by a string. Middle: a roll of packing tape. Right: the same carton sealed with tape, a packing list in its pouch, a shipping label with a barcode and a red sticker, standing on a sack truck, ready to leave.</desc>
  <g transform="translate(40 -40)" stroke="#1d2638" stroke-width="4" stroke-linejoin="miter" stroke-linecap="square">

    <!-- flat cast shadows on the floor -->
    <g fill="#c9b085" stroke="none">
      <polygon points="120,606 400,606 452,634 172,634"/>
      <polygon points="500,606 580,606 606,620 526,620"/>
      <polygon points="628,606 1062,606 1110,634 676,634"/>
    </g>

    <!-- ================= BEFORE: the open carton ================= -->
    <polygon points="150,396 370,396 386,336 166,336" fill="#c9b085"/>
    <polygon points="120,420 150,396 370,396 400,420" fill="#a8743c"/>

    <!-- dark folder -->
    <g transform="rotate(-6 220 420)">
      <path d="M156 300 V284 H204 L214 300 Z" fill="#1d2638"/>
      <rect x="156" y="300" width="128" height="150" fill="#1d2638"/>
      <rect x="176" y="322" width="64" height="22" fill="#f7f3ea" stroke="none"/>
    </g>

    <!-- document 2 with a comment note on its left edge -->
    <g transform="rotate(-3 290 420)">
      <rect x="236" y="262" width="104" height="180" fill="#f7f3ea"/>
      <path d="M254 290 H322 M254 308 H322 M254 326 H306 M254 344 H322 M254 362 H296" fill="none"/>
      <path d="M216 300 H252 V326 H240 L228 338 V326 H216 Z" fill="#c2321b"/>
      <path d="M224 310 H244" stroke="#f7f3ea" fill="none"/>
    </g>

    <!-- document 1 with a comment note on its top corner -->
    <g transform="rotate(8 330 420)">
      <rect x="290" y="278" width="100" height="170" fill="#f7f3ea"/>
      <path d="M306 304 H352 M306 322 H372 M306 340 H356 M306 358 H372" fill="none"/>
      <path d="M352 258 H398 V294 H376 L362 308 V294 H352 Z" fill="#c2321b"/>
      <path d="M362 270 H388 M362 282 H380" stroke="#f7f3ea" fill="none"/>
    </g>

    <!-- the link: a string tied between the two documents -->
    <path d="M262 384 C 270 336, 338 326, 350 378" fill="none"/>
    <circle cx="262" cy="384" r="7" fill="#f7f3ea"/>
    <circle cx="350" cy="378" r="7" fill="#f7f3ea"/>

    <!-- side flaps and front face -->
    <polygon points="120,420 150,396 92,346 58,372" fill="#c9b085"/>
    <polygon points="400,420 370,396 428,346 462,372" fill="#c9b085"/>
    <rect x="120" y="420" width="280" height="186" fill="#c9b085"/>
    <rect x="232" y="446" width="56" height="16" fill="#a8743c"/>
    <!-- "this way up" carton marking -->
    <path d="M150 576 V550 M140 560 L150 550 L160 560 M178 576 V550 M168 560 L178 550 L188 560 M138 588 H190" fill="none"/>

    <!-- ================= BETWEEN: the tape roll ================= -->
    <!-- a strip of tape runs from the roll up to the sealed carton's top seam -->
    <path d="M540 478 C 540 360, 700 310, 802 268" fill="none" stroke="#a8743c" stroke-width="14" stroke-linecap="butt"/>
    <polygon points="540,598 660,598 652,602 660,606 540,606" fill="#a8743c" stroke="none"/>
    <circle cx="540" cy="538" r="60" fill="#a8743c"/>
    <circle cx="540" cy="538" r="26" fill="#dfcba6"/>

    <!-- ================= AFTER: the sealed carton on a sack truck ================= -->
    <!-- truck frame and handle, behind the carton -->
    <rect x="1002" y="214" width="14" height="384" fill="#1d2638" stroke="none"/>
    <polygon points="1002,214 1002,192 1046,170 1054,184 1016,202 1016,214" fill="#1d2638" stroke="none"/>

    <!-- carton: top, tape over the top seam, front -->
    <polygon points="640,280 1000,280 980,256 660,256" fill="#dfcba6"/>
    <polygon points="800,280 840,280 836,256 804,256" fill="#a8743c" stroke="none"/>
    <rect x="640" y="280" width="360" height="318" fill="#c9b085"/>
    <path d="M800 280 H840 V346 L833 354 L826 346 L820 354 L813 346 L807 354 L800 346 Z" fill="#a8743c" stroke="none"/>

    <!-- packing list in its pouch: every line ticked -->
    <rect x="666" y="312" width="112" height="144" fill="#f7f3ea"/>
    <path d="M666 334 H778" fill="none"/>
    <path d="M680 356 L686 362 L698 350 M680 382 L686 388 L698 376 M680 408 L686 414 L698 402 M680 434 L686 440 L698 428" stroke="#285e41" fill="none"/>
    <path d="M708 356 H764 M708 382 H758 M708 408 H764 M708 434 H748" fill="none"/>

    <!-- red sticker: comments inside -->
    <g transform="rotate(5 916 372)">
      <rect x="858" y="344" width="116" height="56" fill="#c2321b"/>
      <path d="M874 356 H906 V380 H890 L880 390 V380 H874 Z" fill="#f7f3ea" stroke="none"/>
      <path d="M920 364 H958 M920 378 H948" stroke="#f7f3ea" fill="none"/>
    </g>

    <!-- shipping label with barcode -->
    <rect x="690" y="470" width="286" height="118" fill="#f7f3ea"/>
    <rect x="706" y="486" width="48" height="26" fill="#1d2638" stroke="none"/>
    <path d="M770 492 H900 M770 506 H860" fill="none"/>
    <path d="M694 524 H972" stroke="#4a5163" stroke-dasharray="10 8" stroke-linecap="butt" fill="none"/>
    <g fill="#1d2638" stroke="none">
      <rect x="708" y="536" width="4" height="38"/>
      <rect x="716" y="536" width="8" height="38"/>
      <rect x="728" y="536" width="4" height="38"/>
      <rect x="736" y="536" width="4" height="38"/>
      <rect x="744" y="536" width="12" height="38"/>
      <rect x="760" y="536" width="4" height="38"/>
      <rect x="768" y="536" width="8" height="38"/>
      <rect x="780" y="536" width="4" height="38"/>
      <rect x="792" y="536" width="4" height="38"/>
      <rect x="800" y="536" width="8" height="38"/>
      <rect x="812" y="536" width="12" height="38"/>
      <rect x="828" y="536" width="4" height="38"/>
      <rect x="836" y="536" width="4" height="38"/>
      <rect x="848" y="536" width="8" height="38"/>
      <rect x="860" y="536" width="4" height="38"/>
      <rect x="868" y="536" width="12" height="38"/>
      <rect x="884" y="536" width="4" height="38"/>
      <rect x="896" y="536" width="4" height="38"/>
      <rect x="904" y="536" width="8" height="38"/>
      <rect x="916" y="536" width="4" height="38"/>
      <rect x="924" y="536" width="12" height="38"/>
      <rect x="940" y="536" width="4" height="38"/>
      <rect x="948" y="536" width="8" height="38"/>
    </g>

    <!-- nose plate and wheel -->
    <rect x="628" y="596" width="390" height="10" fill="#1d2638" stroke="none"/>
    <circle cx="1030" cy="574" r="32" fill="#1d2638"/>
    <circle cx="1030" cy="574" r="10" fill="#f7f3ea" stroke="none"/>

    <!-- floor -->
    <path d="M20 606 H1100" fill="none"/>
  </g>
</svg>
